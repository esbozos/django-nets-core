[metadata]
name = django-nets-core
version = 0.2.30
description = Production-oriented toolkit for Django REST APIs: request validation, OTP auth, OAuth2, roles/permissions, email, push notifications and social login.
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/esbozos/django-nets-core
project_urls =
    Bug Tracker = https://github.com/esbozos/django-nets-core/issues
    Changelog = https://github.com/esbozos/django-nets-core/blob/main/CHANGELOG.md
    Documentation = https://github.com/esbozos/django-nets-core/blob/main/docs/USAGE_GUIDE.rst
author = Norman Torres
author_email = norman.nets@gmail.com
license = BSD-3-Clause
keywords = django, rest, api, auth, otp, oauth2, permissions, push-notifications, social-login, celery
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.0
    Framework :: Django :: 5.1
    Framework :: Django :: 5.2
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content
    Topic :: Software Development :: Libraries :: Application Frameworks
    Topic :: Security

[options]
include_package_data = true
packages = find:
python_requires = >=3.10
install_requires =
    Django >= 5.1.14
    google-auth >= 2.37.0
    PyJWT >= 2.12.1
    pytz >= 2026.2
    python-dateutil >= 2.9.0.post0
    shortuuid >= 1.0.13
    django-oauth-toolkit >= 3.0.1
    firebase-admin >= 7.4.0
    celery >= 5.6.3
    django-cors-headers >= 4.9.0
    pymemcache >= 4.0.0
    channels >= 4.3.2
    channels-redis >= 4.3.0
    daphne >= 4.2.1

[options.extras_require]
dev =
    pytest >= 8.3.0
    pytest-django >= 4.9.0
    coverage >= 7.6.0
    black >= 25.1.0
    ruff >= 0.11.0
