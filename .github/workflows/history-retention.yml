name: History Retention Regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            django: 'Django>=5.1.14,<5.2'
          - python: '3.11'
            django: 'Django>=5.1.14,<5.2'
          - python: '3.12'
            django: 'Django>=5.2,<5.3'
          - python: '3.13'
            django: 'Django>=5.2,<5.3'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: nets_core_tests.settings
      DJANGO_SECRET_KEY: ci-test-only-not-for-deployment
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ci-test-only
      DB_TEST_NAME: test_nets_core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . 'psycopg[binary]>=3.2,<4' '${{ matrix.django }}'
      - run: python -m django test nets_core_tests --noinput
      - run: python -m django makemigrations --check --dry-run